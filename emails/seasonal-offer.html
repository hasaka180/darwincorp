<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>High performing interactive websites</title>
<!--
  The seasonal offer creative, exactly as designed.

  The artwork is a flattened render of the /lp/websites creative, hosted at
  thedarwin.co and referenced by absolute URL — the only way to keep the
  layout, the sunset artwork and the Instrument Serif / Handjet type intact
  in Gmail, which strips CSS variables, positioning and data: URIs.

  The whole image links through to the landing page. Real text sits under it
  so the message still reads when images are blocked, and so it doesn't look
  like an image-only blast to spam filters.

  To re-render after changing the creative:
    Chrome --headless=new --force-device-scale-factor=2 \
           --window-size=984,2109 --screenshot=out.png <creative>.html
    sips -s format jpeg -s formatOptions 68 out.png \
         --resampleWidth 1200 --out public/assets/lp/seasonal-offer.jpg
-->
</head>
<body style="margin:0; padding:0; background-color:#0a1330;">

<!-- preheader: the grey preview line beside the subject in the inbox -->
<div style="display:none; font-size:1px; color:#0a1330; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
  Custom-coded, interactive websites from AED 3,000 — design, build, launch and on-page SEO included.
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0a1330;">
  <tr>
    <td align="center" style="padding:24px 12px;">

      <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px;">

        <!-- the creative -->
        <tr>
          <td align="center" style="padding:0; font-size:0; line-height:0;">
            <a href="https://www.thedarwin.co/lp/websites" style="text-decoration:none;">
              <img src="https://www.thedarwin.co/assets/lp/seasonal-offer.jpg"
                   width="600" alt="Darwin — we build high performing interactive websites. Season pricing from AED 3,000, design, build, launch and on-page SEO included."
                   style="display:block; width:100%; max-width:600px; height:auto; border:0; outline:none; text-decoration:none;" />
            </a>
          </td>
        </tr>

        <!-- The creative already carries the copy, the CTA and the contact
             line, so nothing is repeated here. Only the unsubscribe notice
             remains: it can't live inside a flat image, and bulk email
             legally requires it. -->
        <tr>
          <td align="center" style="background-color:#0a1330; padding:18px 30px 8px 30px;">
            <div style="font-family:Arial,Helvetica,sans-serif; font-size:11px; line-height:18px; color:#6b7cae;">
              You received this because you enquired about a website with Darwin.<br />
              <a href="{{{RESEND_UNSUBSCRIBE_URL}}}" style="color:#8fa2d8; text-decoration:underline;">Unsubscribe</a>
            </div>
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
